<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HHT UNACEM | Control SST</title><style>
:root{--red:#f00016;--black:#090909;--bg:#f3f5f8;--line:#dbe2eb;--ink:#17263a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--ink)}header{background:#080808;color:white;padding:23px max(18px,5vw);display:flex;align-items:center;gap:20px}header strong{font-size:21px}header small{display:block;margin-top:7px}header .logo{width:52px;height:52px;object-fit:contain;flex-shrink:0}header{min-height:106px}.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:42px;color:#53657c;font-weight:600}.spinner{width:24px;height:24px;border:3px solid #dbe2eb;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}nav{background:white;display:flex;gap:7px;padding:13px 3vw;overflow:auto;border-bottom:1px solid var(--line)}button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;background:#e6e9ef;font-weight:700;color:#102032}nav button{white-space:nowrap}button.active,.primary{background:var(--red);color:white}.primary{width:100%}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1450px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:22px;margin:12px 0;box-shadow:0 2px 12px #13223b09}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{padding:18px;background:white;border:1px solid #edf0f5;border-radius:14px}.metric b{display:block;font-size:27px;margin-top:10px}.metric small{color:#65758b}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cbd6e4;border-radius:7px;padding:11px;font:14px Arial;width:100%;background:white;color:#102032}.field textarea{min-height:74px}h2{margin:0 0 18px;font-size:23px}h3{margin:20px 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#e8edf4;text-align:left}th,td{padding:10px;border-bottom:1px solid #e2e8f0}tr:hover td{background:#f7f9fc}.scroll{overflow:auto}.barrow{display:grid;grid-template-columns:minmax(105px,230px) 1fr 90px;align-items:center;gap:12px;padding:7px 0}.track{height:19px;background:#f0f2f6;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--red);border-radius:5px}.fill.blue{background:#315caa}.fill.orange{background:#f59d28}.tag{display:inline-block;padding:5px 9px;border-radius:15px;background:#edf1f7;font-size:12px}.warn{color:#ab3b00}.danger{color:#c00016}.good{color:#187747}.muted{color:#64748b}.message{padding:14px;border-radius:9px;background:#eef7f1;margin-bottom:12px}.message.error{background:#ffebee;color:#b00020}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}.tabs button{padding:9px 12px}.hide{display:none!important}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){header strong{font-size:15px}.split{grid-template-columns:1fr}.panel{padding:14px}.barrow{grid-template-columns:105px 1fr 60px;font-size:11px}}
</style></head><body><header><img class="logo" src="logo-unacem.png" alt="UNACEM"><div><strong>CONTROL DE REPORTE DE INDICADORES SST Y ACTIVIDADES DPA</strong><small>UNACEM Perú | División de Proyectos Atocongo · DPA / DIA</small></div></header><nav id="nav"></nav><main><div id="notice" class="message hide" role="status" aria-live="polite"></div><section id="view"><div class="loading"><span class="spinner" aria-hidden="true"></span>Cargando información de HHT UNACEM...</div></section></main><div id="dpaModal" class="hide" style="position:fixed;inset:0;background:#0a1424a6;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px"><div style="background:white;border-radius:16px;padding:26px;width:min(100%,420px);box-shadow:0 20px 60px #0003"><h2>🔒 Acceso a Gestión DPA</h2><p>Ingrese la clave autorizada para continuar.</p><label class="field">Clave de acceso<input id="dpaPassword" type="password" autocomplete="off" placeholder="Contraseña"></label><p id="dpaError" class="danger" role="alert"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="dpaCancel">Cancelar</button><button class="primary" style="width:auto" id="dpaEnter">Ingresar</button></div></div></div><script src="config.js"></script><script>
'use strict';const TABS=[['dashboard','Dashboard SST'],['report','Reporte semanal'],['companies','Empresas'],['tracking','Seguimiento'],['monthly','Consolidado mensual'],['critical','Actividades críticas'],['dpa','Gestión DPA']];const state={dpaUnlocked:false,dpaPin:'',page:'dashboard',data:null,company:'',sub:'inspections',area:'Todas',week:'Todas',trackArea:'DPA',trackWeek:'',alerts:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:2});const norm=s=>String(s||'').trim();const arr=k=>state.data?.[k]||[];const monthKey=m=>{const names=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','setiembre','octubre','noviembre','diciembre'];const i=names.indexOf(String(m||'').toLowerCase());return i===9?8:i>9?i-1:i};const monthNow=()=>new Date().getMonth();const yearNow=()=>new Date().getFullYear();const active=c=>norm(c.estado||'Activo').toLowerCase()==='activo';const weeks=()=>arr('Calendario_2026');const weekDates=w=>{const r=String(w.rango||'').toLowerCase();const names=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','setiembre','octubre','noviembre','diciembre'];const m=r.match(/(?:del?\s*)?(\d{1,2})\s*(?:al|[-–])\s*\d{1,2}\s*de\s*([a-záéíóú]+)/);if(m){const month=names.indexOf(m[2]);return month<0?null:new Date(Number(w.anio||2026),month===9?8:month>9?month-1:month,+m[1])}return null};const orderedWeeks=()=>[...weeks()].sort((a,b)=>{const da=weekDates(a),db=weekDates(b);return da&&db?da-db:String(a.codigo).localeCompare(String(b.codigo),undefined,{numeric:true})});const currentWeek=()=>{const today=new Date(),ws=orderedWeeks();return ws.find(w=>{const d=weekDates(w);return d&&today>=d&&today<new Date(d.getTime()+7*864e5)})||ws.filter(w=>{const d=weekDates(w);return d&&d<=today}).at(-1)||ws.at(-1)||{}};const previousWeek=()=>{const ws=orderedWeeks(),ix=ws.findIndex(w=>w.codigo===currentWeek().codigo);return ws[Math.max(0,ix-1)]||{}};const weekOpts=()=>orderedWeeks().map(w=>({value:w.codigo,label:w.semana+' · '+w.rango}));const companies=()=>arr('Empresas').filter(active);const areas=()=>[...new Set([...arr('Empresas').map(x=>x.area),...arr('Proyectos').map(x=>x.area)].filter(Boolean))].sort();const option=(val,label)=>`<option value="${esc(val)}">${esc(label??val)}</option>`;const sel=(id,values,selected,all)=>`<select id="${id}">${all?`<option value="Todas" ${selected==='Todas'?'selected':''}>Todas</option>`:''}${values.map(x=>`<option value="${esc(x.value??x)}" ${(String(x.value??x)===String(selected))?'selected':''}>${esc(x.label??x.value??x)}</option>`).join('')}</select>`;const field=(name,id,type='text',value='')=>`<label class="field">${esc(name)}<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}></label>`;const msg=(text,error=false)=>{$('notice').className='message'+(error?' error':'')+(!text?' hide':'');$('notice').textContent=text};const formval=ids=>Object.fromEntries(ids.map(id=>[id,$(id)?.value||'']));
function api(action='bootstrap',payload={}){return new Promise((resolve,reject)=>{const url=window.HHT_API_URL||'';if(!url.includes('/exec'))return reject(Error('Falta configurar HHT_API_URL en config.js'));const callback='hhtCb'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>done(Error('La conexión superó 25 segundos. Verifica la implementación de Apps Script.')),25000);function done(err,val){clearTimeout(timer);delete window[callback];script.remove();err?reject(err):resolve(val)}window[callback]=response=>response.ok?done(null,response.data):done(Error(response.error||'Error del servidor'));const params=new URLSearchParams({action,callback,payload:JSON.stringify(payload)});if(params.toString().length>5500)return done(Error('Registro demasiado extenso para esta conexión; reduce el texto.'));script.src=url+'?'+params;script.onerror=()=>done(Error('No se pudo cargar la API de Apps Script'));document.head.appendChild(script)})}
async function load(){try{state.data=await api();render();msg('');try{if(state.dpaUnlocked){state.alerts=await api('alerts',{pin:state.dpaPin});render()}}catch(alertError){console.warn('Alertas no disponibles:',alertError)}}catch(e){msg(e.message,true);render()}}
async function save(action,p){try{msg('Guardando información...');await api(action,p);await load();msg('Información guardada correctamente')}catch(e){msg(e.message,true)}}
function nav(){ $('nav').innerHTML=TABS.map(([id,label])=>`<button class="${state.page===id?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.page=b.dataset.tab;render()})}
function render(){nav();const renderers={dashboard,report,companiesView,tracking,monthly,critical,dpa};$('view').innerHTML=(renderers[state.page==='companies'?'companiesView':state.page]||dashboard)();wire()}
function filtered(){return arr('Reportes_HHT').filter(r=>(state.week==='Todas'||r.codigo===state.week)&&(state.area==='Todas'||r.area===state.area))}
function bars(items,color=''){const max=Math.max(1,...items.map(x=>x[1]));return items.length?items.sort((a,b)=>b[1]-a[1]).map(([name,value])=>`<div class="barrow"><span title="${esc(name)}">${esc(name)}</span><div class="track"><div class="fill ${color}" style="width:${Math.max(0,100*value/max)}%"></div></div><b>${money(value)}</b></div>`).join(''):'<p class="muted">Sin registros para los filtros seleccionados.</p>'}
function sumBy(rows,key,metric){const map={};rows.forEach(r=>map[r[key]||'Sin especificar']=(map[r[key]||'Sin especificar']||0)+Number(r[metric]||0));return Object.entries(map)}
function statusRows(){const w=state.week==='Todas'?weeks():weeks().filter(x=>x.codigo===state.week);const list=companies().filter(c=>state.area==='Todas'||c.area===state.area);return list.flatMap(c=>w.map(week=>{const reports=arr('Reportes_HHT').filter(r=>r.empresa===c.empresa&&r.area===c.area&&r.codigo===week.codigo);const inactive=arr('Inactividad').some(r=>r.empresa===c.empresa&&r.area===c.area&&r.codigo===week.codigo);return{empresa:c.empresa,area:c.area,semana:week.semana,codigo:week.codigo,estado:reports.length?'Reportó':inactive?'Sin actividades':'Pendiente'}}))}
function filters(){return `<div class="grid"><label class="field">Semana${sel('filterWeek',weekOpts(),state.week,true)}</label><label class="field">Área usuaria${sel('filterArea',areas(),state.area,true)}</label></div>`}
function monthReports(){return arr('Reportes_HHT').filter(r=>monthKey(r.mes)===monthNow()&&Number(r.anio||yearNow())===yearNow())}
function monthlyWorkers(){const rs=monthReports();return companies().reduce((total,c)=>{const nums=rs.filter(r=>r.empresa===c.empresa&&r.area===c.area).map(r=>Number(r.trabajadores)).filter(n=>Number.isFinite(n)&&n>0);return total+(nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:0)},0)}
function activeMonthCompanies(){const rs=monthReports(),ina=arr('Inactividad');const codes=new Set(orderedWeeks().filter(w=>monthKey(w.mes)===monthNow()&&Number(w.anio||yearNow())===yearNow()).map(w=>w.codigo));return companies().filter(c=>rs.some(r=>r.empresa===c.empresa&&r.area===c.area)||ina.some(r=>r.empresa===c.empresa&&r.area===c.area&&codes.has(r.codigo))).length}
function dashboard(){const r=filtered(),s=key=>r.reduce((a,x)=>a+Number(x[key]||0),0),statuses=statusRows(),reported=statuses.filter(x=>x.estado!=='Pendiente').length,pct=statuses.length?100*reported/statuses.length:0;return `<div class="panel"><h2>Dashboard SST · Indicadores acumulados</h2>${filters()}<p class="muted">Los indicadores acumulados responden a los filtros; los indicadores mensuales corresponden al mes en curso.</p></div><div class="metrics">${[['HHT reportadas',money(s('hht'))],['Promedio trabajadores · mes en curso',money(monthlyWorkers())],['Empresas activas · mes en curso',activeMonthCompanies()],['Incidentes',s('incidentes')],['Primeros auxilios',s('atenciones')],['Accidentes leves',s('leves')],['Incapacitantes',s('incapacitantes')],['Mortales',s('mortales')],['Cumplimiento',pct.toFixed(1)+'%']].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><h3>HHT por empresa 2026</h3>${bars(sumBy(arr('Reportes_HHT').filter(x=>Number(x.anio||2026)===2026&&companies().some(c=>c.empresa===x.empresa&&c.area===x.area)),'empresa','hht'))}</div><div class="panel"><h3>HHT por mes</h3>${bars(monthlyRows().map(x=>[x.name,x.hht]))}</div>`}

function completed(c,w){return arr('Reportes_HHT').some(r=>r.empresa===c.empresa&&r.area===c.area&&r.codigo===w.codigo)||arr('Inactividad').some(r=>r.empresa===c.empresa&&r.area===c.area&&r.codigo===w.codigo)}
function completion(w){const cs=companies();return cs.length?100*cs.filter(c=>completed(c,w)).length/cs.length:0}
function averageWorkers(rs){return rs.length?rs.reduce((n,r)=>n+Number(r.trabajadores||0),0)/rs.length:0}
function monthlyRows(){const m=new Map();orderedWeeks().forEach(w=>{const key=String(w.anio||'2026')+'|'+String(w.mes||'');if(!m.has(key))m.set(key,{name:String(w.mes||'')+' '+String(w.anio||'2026'),weeks:[]});m.get(key).weeks.push(w)});return [...m.values()].map(x=>{const codes=new Set(x.weeks.map(w=>w.codigo));const rs=arr('Reportes_HHT').filter(r=>codes.has(r.codigo));return {...x,hht:rs.reduce((n,r)=>n+Number(r.hht||0),0),workers:averageWorkers(rs)}})}
function extraDashboard(){const last=orderedWeeks().filter(w=>{const d=weekDates(w);return d&&d<=new Date()}).slice(-2);const latest=last.at(-1)||currentWeek();const act=companies();const lastRows=arr('Reportes_HHT').filter(r=>r.codigo===latest.codigo);const activeRows=filtered().filter(r=>act.some(c=>c.empresa===r.empresa&&c.area===r.area));const m=monthlyRows();return `<div class="split"><div class="panel"><h3>Cumplimiento de reporte de las 2 últimas semanas</h3>${bars(last.map(w=>[w.semana+' · '+w.rango,Math.round(completion(w)*10)/10]),'blue')}<p class="muted">Incluye reportes HHT y declaraciones de inactividad. Base: empresas activas.</p></div><div class="panel"><h3>Empresas activas · trabajadores promedio de la última semana</h3><p class="muted">${esc(latest.semana||'Sin semana')} · ${esc(latest.rango||'')}</p>${bars(act.map(c=>[c.empresa,averageWorkers(lastRows.filter(r=>r.empresa===c.empresa&&r.area===c.area))]),'blue')}</div></div><div class="split"><div class="panel"><h3>HHT por mes</h3>${bars(m.map(x=>[x.name,x.hht]))}</div><div class="panel"><h3>Trabajadores promedio por mes</h3>${bars(m.map(x=>[x.name,Math.round(x.workers*10)/10]),'blue')}<p class="muted">Promedio de dotaciones registradas por empresa y semana; no suma mensual.</p></div></div>`}
function report(){const cs=companies();const selected=cs.some(c=>c.empresa===state.company)?state.company:cs[0]?.empresa||'';state.company=selected;const c=cs.find(x=>x.empresa===selected)||{};const p=arr('Proyectos').filter(x=>active(x)&&x.area===c.area&&(!x.empresa||x.empresa===selected));const history=arr('Reportes_HHT').filter(x=>x.empresa===selected);const inactive=arr('Inactividad').filter(x=>x.empresa===selected);const missing=orderedWeeks().filter(w=>monthKey(w.mes)===monthNow()&&Number(w.anio||yearNow())===yearNow()&&weekDates(w)&&new Date(weekDates(w).getTime()+7*864e5)<=new Date()&&!completed(c,w));return `<div class="panel"><h2>Reporte semanal por empresa</h2><p class="muted">Selecciona una empresa activa para consultar, registrar o editar sus indicadores.</p><div class="tabs">${cs.map(x=>`<button class="${selected===x.empresa?'active':''}" data-company="${esc(x.empresa)}">${esc(x.empresa)}</button>`).join('')}</div><h3>${esc(selected||'Sin empresas activas')} <span class="tag">${esc(c.area||'')}</span></h3>${missing.length?`<div class="message error" role="alert"><b>Semanas pendientes del mes en curso:</b> ${missing.map(w=>esc(w.semana)).join(', ')}. Registre HHT o declare inactividad.</div>`:''}<div class="grid"><label class="field">Semana a reportar${sel('repWeek',weekOpts(),currentWeek().codigo)}</label><label class="field">Proyecto${sel('repProject',p.map(x=>x.proyecto))}</label>${field('N.º trabajadores','trabajadores','number',0)}${field('Horas hombre trabajadas','hht','number',0)}${[['Observaciones Isometrix','observaciones'],['Incidentes / peligrosos','incidentes'],['Primeros auxilios','atenciones'],['Accidentes leves','leves'],['Incapacitantes','incapacitantes'],['Mortales','mortales'],['Días perdidos','diasPerdidos']].map(x=>field(x[0],x[1],'number',0)).join('')}</div><p><button class="primary" id="saveReport">Guardar o actualizar semana</button></p></div><div class="panel" style="border-left:5px solid #e7a03b"><h2>Declaración de semana sin actividades</h2><p class="muted">Registra esta opción únicamente cuando la empresa no realizó trabajos.</p><div class="grid"><label class="field">Semana${sel('inaWeek',weekOpts(),currentWeek().codigo)}</label>${field('Motivo','inaReason','text','Sin trabajos programados')}</div><p><button id="inactive">Registrar semana sin actividades</button></p></div><div class="panel"><h2>Historial de reportes · ${esc(selected)}</h2><p class="muted">Pulsa Editar para cargar los valores en el formulario.</p><div class="scroll"><table><thead><tr><th>Semana</th><th>Proyecto</th><th>Trabajadores</th><th>HHT</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${history.map((x,i)=>({...x,_original:i})).sort((a,b)=>String(b.codigo).localeCompare(String(a.codigo),undefined,{numeric:true})).map(x=>`<tr><td>${esc(x.semana)}</td><td>${esc(x.proyecto)}</td><td>${money(x.trabajadores)}</td><td>${money(x.hht)}</td><td>Reportó</td><td><button data-edit="${x._original}">Editar</button></td></tr>`).join('')}${[...inactive].sort((a,b)=>String(b.codigo).localeCompare(String(a.codigo),undefined,{numeric:true})).map(x=>`<tr><td>${esc(x.semana)}</td><td>—</td><td>0</td><td>0</td><td>Sin actividades</td><td>—</td></tr>`).join('')}</tbody></table></div></div>`}
function companiesView(){return `<div class="panel"><h2>Directorio de Empresas</h2><p class="muted">Cada empresa puede registrar su directorio para iniciar el reporte de horas hombre y actualizar sus responsables operativos y SSOMA. A estos contactos se enviarán los recordatorios y el resumen de indicadores de su empresa.</p><div class="grid">${[['Empresa','empresa'],['Área','area'],['Estado','estado'],['Supervisor operativo','supervisorOperativo'],['Correo operativo','correoOperativo'],['Supervisor SSOMA','supervisorSSOMA'],['Correo SSOMA','correoSSOMA'],['Celular','celular'],['Responsable de área','responsableArea']].map(([label,id])=>id==='area'||id==='estado'?`<label class="field">${label}${sel('co_'+id,id==='area'?areas():['Activo','Inactivo'])}</label>`:field(label,'co_'+id)).join('')}</div><input type="hidden" id="previous"><p><button id="saveCompany" class="primary">Guardar empresa</button></p><div class="scroll"><table><thead><tr><th>Empresa</th><th>Área</th><th>Operativo</th><th>SSOMA</th><th>Estado</th><th></th></tr></thead><tbody>${arr('Empresas').map((x,i)=>`<tr><td>${esc(x.empresa)}</td><td>${esc(x.area)}</td><td>${esc(x.supervisorOperativo)}</td><td>${esc(x.supervisorSSOMA)}</td><td>${esc(x.estado)}</td><td><button data-co="${i}">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function tracking(){const oldWeek=state.week,oldArea=state.area;state.week=state.trackWeek||previousWeek().codigo;state.area=state.trackArea;const x=statusRows();state.week=oldWeek;state.area=oldArea;return `<div class="panel"><h2>Seguimiento de reportes HHT</h2><div class="grid"><label class="field">Semana${sel('trackWeek',weekOpts(),state.trackWeek||previousWeek().codigo)}</label><label class="field">Área usuaria${sel('trackArea',areas(),state.trackArea)}</label></div><div class="metrics">${['Reportó','Sin actividades','Pendiente'].map(k=>`<div class="metric"><small>${k}</small><b>${x.filter(a=>a.estado===k).length}</b></div>`).join('')}</div><h3>Estado por empresa y semana</h3><div class="scroll"><table><thead><tr><th>Empresa</th><th>Área</th><th>Semana</th><th>Estado</th></tr></thead><tbody>${x.map(a=>`<tr><td>${esc(a.empresa)}</td><td>${esc(a.area)}</td><td>${esc(a.semana)}</td><td class="${a.estado==='Pendiente'?'danger':a.estado==='Reportó'?'good':'warn'}">${a.estado}</td></tr>`).join('')}</tbody></table></div><h3>Cumplimiento de reporte de las 2 últimas semanas</h3>${bars(orderedWeeks().filter(w=>{const d=weekDates(w);return d&&new Date(d.getTime()+7*864e5)<=new Date()}).slice(-2).map(w=>[w.semana+' · '+w.rango,Math.round(completion(w)*10)/10]),'blue')}<p class="muted">Incluye reportes HHT y declaraciones de inactividad; base: empresas activas.</p></div>`}
function monthly(){const monthNames=[...new Set(weeks().map(w=>w.mes).filter(Boolean))];return `<div class="panel"><h2>Consolidado mensual de HHT</h2><p class="muted">Se suman únicamente las semanas oficiales del mes, incluyendo los períodos A/B correspondientes.</p>${['DPA','DIA'].map(area=>`<h3>Área usuaria ${area}</h3><div class="scroll"><table><thead><tr><th>Empresa</th>${monthNames.map(m=>`<th>${esc(m)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${[...new Set(arr('Reportes_HHT').filter(r=>r.area===area).map(r=>r.empresa))].map(empresa=>{const rs=arr('Reportes_HHT').filter(r=>r.empresa===empresa&&r.area===area);return `<tr><td>${esc(empresa)}</td>${monthNames.map(m=>`<td>${money(rs.filter(r=>r.mes===m).reduce((n,r)=>n+Number(r.hht||0),0))}</td>`).join('')}<td><b>${money(rs.reduce((n,r)=>n+Number(r.hht||0),0))}</b></td></tr>`}).join('')}</tbody></table></div>`).join('')}<h3>Detalle semanal por empresa y mes</h3><div class="grid"><label class="field">Empresa${sel('monthCompany',companies().map(c=>c.empresa),state.monthCompany||companies()[0]?.empresa||'')}</label><label class="field">Mes${sel('monthFilter',[...new Set(orderedWeeks().map(w=>w.mes))],state.monthFilter||currentWeek().mes)}</label></div><div id="monthDetail"></div></div>`}
function critical(){return `<div class="panel"><h2>Actividades críticas · DPA y DIA</h2><p>Esta sección se conectará a los registros y al plano del aplicativo <b>Gestión diaria de trabajos de alto riesgo</b>.</p><div class="grid"><div class="metric"><small>DPA</small><b style="color:#ed0015">●</b><span>Marcadores rojos</span></div><div class="metric"><small>DIA</small><b style="color:#315caa">●</b><span>Marcadores azules</span></div></div><p class="muted">Integración pendiente: se requiere la URL de lectura de los datos del aplicativo de alto riesgo y su plano original. No se inventan puntos ni actividades.</p><a href="https://trabajos-alto-riesgo-unacem.vercel.app/" target="_blank" rel="noopener noreferrer">Abrir aplicativo de trabajos de alto riesgo ↗</a></div>`}
function dpa(){if(!state.dpaUnlocked)return '<div class="panel"><h2>Gestión DPA</h2><p>Este módulo requiere una clave de acceso.</p><button id="openDpa" class="primary">Ingresar a Gestión DPA</button></div>';const inspections=arr('Inspecciones'),events=arr('Eventos_SST'),actions=arr('Acciones_Correctivas');return `<div class="panel"><h2>Gestión DPA · Inspecciones y eventos SST</h2><div class="tabs"><button data-sub="inspections" class="${state.sub==='inspections'?'active':''}">Programa de inspecciones</button><button data-sub="events" class="${state.sub==='events'?'active':''}">Eventos SST y acciones correctivas</button></div>${state.sub==='inspections'?`<div class="metrics">${[['Programadas',inspections.filter(x=>x.estado==='Programado').length],['Ejecutadas',inspections.filter(x=>x.estado==='Ejecutado').length]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><h3>Programar inspección</h3><div class="grid"><label class="field">Semana${sel('inspWeek',weeks().map(x=>({value:x.codigo,label:x.semana})))}</label><label class="field">Supervisor UNACEM${sel('inspSupervisor',arr('Supervisores_UNACEM').map(x=>x.nombre))}</label><label class="field">Proyecto${sel('inspProject',arr('Proyectos').map(x=>x.proyecto))}</label><label class="field">Empresa${sel('inspCompany',companies().map(x=>x.empresa))}</label><label class="field">Tipo${sel('inspType',['Supervisor','Líder','Conjunta'])}</label>${field('Fecha programada','inspDate','date')}<label class="field">Estado${sel('inspStatus',['Programado','Ejecutado','Reprogramado','Cancelado'])}</label></div><p><button id="saveInspection" class="primary">Guardar inspección</button></p>${simpleTable(inspections,['semana','supervisor','proyecto','empresa','estado'])}`:`<div class="metrics"><div class="metric"><small>Eventos abiertos</small><b>${events.filter(x=>x.estado!=='Cerrado').length}</b></div><div class="metric"><small>Eventos vencidos (10 días hábiles o plazo)</small><b class="danger">${state.alerts.filter(x=>x.vencido).length}</b></div><div class="metric"><small>Acciones pendientes</small><b>${actions.filter(x=>x.estado!=='Cerrado').length}</b></div></div><h3>Registrar evento SST</h3><div class="grid">${field('Fecha del evento','evDate','date')}<label class="field">Tipo${sel('evType',['Incidente','Accidente leve','Incapacitante','Mortal','Peligroso'])}</label><label class="field">Empresa${sel('evCompany',companies().map(x=>x.empresa))}</label><label class="field">Área${sel('evArea',areas())}</label>${field('Responsable','evResponsible')}${field('Correo','evEmail','email')}${field('Fecha registro Isometrix','evIso','date')}${field('Fecha ACR','evAcr','date')}${field('Fecha de cierre prevista','evDue','date')}<label class="field">Estado${sel('evStatus',['Abierto','En investigación','Cerrado'])}</label></div><label class="field">Descripción<textarea id="evDescription"></textarea></label><p><button class="primary" id="saveEvent">Guardar evento</button></p><h3>Agregar acción correctiva a un evento</h3><div class="grid"><label class="field">Evento${sel('acEvent',events.map(x=>({value:x.evento,label:x.fechaEvento+' · '+x.descripcion.slice(0,50)})))}</label>${field('Acción correctiva','acDescription')}${field('Responsable','acResponsible')}${field('Correo','acEmail','email')}${field('Fecha compromiso','acDue','date')}<label class="field">Estado${sel('acStatus',['Pendiente','En proceso','Cerrado'])}</label></div><p><button class="primary" id="saveAction">Guardar acción</button></p><h3>Eventos registrados</h3>${simpleTable(events,['fechaEvento','tipo','empresa','descripcion','fechaCierrePrevista','estado'])}<h3>Acciones correctivas</h3>${simpleTable(actions,['evento','descripcion','responsable','fechaCompromiso','estado'])}`}</div>`}
function simpleTable(rows,fields){return `<div class="scroll"><table><thead><tr>${fields.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function unlockDpa(){const pin=$('dpaPassword').value;const btn=$('dpaEnter');btn.disabled=true;$('dpaError').textContent='';try{const result=await api('dpaBootstrap',{pin});state.dpaPin=pin;Object.assign(state.data,result);state.dpaUnlocked=true;try{state.alerts=await api('alerts',{pin})}catch(e){console.warn(e)}$('dpaModal').classList.add('hide');render()}catch(e){$('dpaError').textContent=e.message}finally{btn.disabled=false}}
function wire(){if($('openDpa'))$('openDpa').onclick=()=>{$('dpaModal').classList.remove('hide');$('dpaPassword').focus()};document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>{state.company=b.dataset.company;render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.sub=b.dataset.sub;render()});for(const id of ['filterWeek','filterArea'])if($(id))$(id).onchange=()=>{state[id==='filterWeek'?'week':'area']=$(id).value;render()};for(const id of ['trackWeek','trackArea'])if($(id))$(id).onchange=()=>{state[id==='trackWeek'?'trackWeek':'trackArea']=$(id).value;render()};if($('repWeek'))$('repWeek').onchange=()=>{};if($('monthCompany')){const update=()=>{state.monthCompany=$('monthCompany').value;state.monthFilter=$('monthFilter').value;const company=companies().find(c=>c.empresa===state.monthCompany);const ws=orderedWeeks().filter(w=>w.mes===state.monthFilter&&weekDates(w)&&weekDates(w)<=new Date());$('monthDetail').innerHTML=simpleTable(ws.map(w=>{const r=arr('Reportes_HHT').filter(x=>x.empresa===state.monthCompany&&x.codigo===w.codigo);return {semana:w.semana,rango:w.rango,hht:r.reduce((n,x)=>n+Number(x.hht||0),0),trabajadores:Math.round(averageWorkers(r)*10)/10,estado:company?(completed(company,w)?(r.length?'Reportó':'Sin actividades'):'Pendiente'):'No activa'}}),['semana','rango','hht','trabajadores','estado'])};$('monthCompany').onchange=update;$('monthFilter').onchange=update;update()}
 if($('saveReport'))$('saveReport').onclick=async()=>{const ids=['trabajadores','hht','observaciones','incidentes','atenciones','leves','incapacitantes','mortales','diasPerdidos'];if(!state.company||!$('repWeek').value||!$('repProject').value||ids.some(k=>$(k).value.trim()==='')){alert('Todos los campos son obligatorios. Verifica la empresa, semana, proyecto e indicadores.');return}const summary=`Empresa: ${state.company}\nSemana: ${$('repWeek').selectedOptions[0]?.text}\nProyecto: ${$('repProject').value}\nTrabajadores: ${$('trabajadores').value}\nHHT: ${$('hht').value}\nObservaciones: ${$('observaciones').value}\nIncidentes: ${$('incidentes').value}\nPrimeros auxilios: ${$('atenciones').value}\nAccidentes leves: ${$('leves').value}\nIncapacitantes: ${$('incapacitantes').value}\nMortales: ${$('mortales').value}\nDías perdidos: ${$('diasPerdidos').value}`;if(!confirm('VALIDACIÓN DEL REPORTE\n\n'+summary+'\n\n¿Confirmas que la empresa y los datos son correctos?'))return;const btn=$('saveReport');btn.disabled=true;try{await save('saveReport',{empresa:state.company,area:companies().find(x=>x.empresa===state.company)?.area,proyecto:$('repProject').value,codigo:$('repWeek').value,...formval(['trabajadores','hht','observaciones','incidentes','atenciones','leves','incapacitantes','mortales','diasPerdidos'])})}finally{if(document.contains(btn))btn.disabled=false}};
 if($('inactive'))$('inactive').onclick=()=>save('inactive',{empresa:state.company,area:companies().find(x=>x.empresa===state.company)?.area,codigo:$('inaWeek').value,motivo:$('inaReason').value});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=arr('Reportes_HHT').filter(x=>x.empresa===state.company)[Number(b.dataset.edit)];$('repWeek').value=x.codigo;$('repProject').value=x.proyecto;['trabajadores','hht','observaciones','incidentes','atenciones','leves','incapacitantes','mortales','diasPerdidos'].forEach(k=>$(k).value=x[k]||0);window.scrollTo({top:100,behavior:'smooth'})});
 document.querySelectorAll('[data-co]').forEach(b=>b.onclick=async()=>{const x=arr('Empresas')[Number(b.dataset.co)];const key=prompt('Clave de edición de '+x.empresa+':');if(key===null)return;try{await api('verifyCompanyKey',{empresa:x.empresa,clave:key})}catch(e){alert(e.message);return}state.companyEditKey=key;const approved=confirm('Edición autorizada para '+x.empresa+'. Se cargarán los datos en el formulario para su actualización. ¿Continuar?');if(!approved)return;Object.keys(x).forEach(k=>{if($('co_'+k))$('co_'+k).value=x[k]});$('previous').value=x.empresa;window.scrollTo({top:100,behavior:'smooth'})});
 if($('saveCompany'))$('saveCompany').onclick=async()=>{const btn=$('saveCompany');btn.disabled=true;try{await save('saveCompany',{...Object.fromEntries(['empresa','area','estado','supervisorOperativo','correoOperativo','supervisorSSOMA','correoSSOMA','celular','responsableArea'].map(k=>[k,$('co_'+k).value])),nombreAnterior:$('previous').value,claveEdicion:state.companyEditKey||''})}finally{if(document.contains(btn))btn.disabled=false}};
 if($('saveInspection'))$('saveInspection').onclick=()=>{const sup=arr('Supervisores_UNACEM').find(x=>x.nombre===$('inspSupervisor').value)||{};save('saveInspection',{pin:state.dpaPin,semana:$('inspWeek').value,supervisor:sup.nombre,area:sup.area,proyecto:$('inspProject').value,empresa:$('inspCompany').value,tipo:$('inspType').value,fechaProgramada:$('inspDate').value,estado:$('inspStatus').value})};
 if($('saveEvent'))$('saveEvent').onclick=()=>save('saveEvent',{pin:state.dpaPin,fechaEvento:$('evDate').value,tipo:$('evType').value,empresa:$('evCompany').value,area:$('evArea').value,responsable:$('evResponsible').value,correo:$('evEmail').value,fechaIsometrix:$('evIso').value,fechaACR:$('evAcr').value,fechaCierrePrevista:$('evDue').value,estado:$('evStatus').value,descripcion:$('evDescription').value});
 if($('saveAction'))$('saveAction').onclick=()=>save('saveAction',{pin:state.dpaPin,evento:$('acEvent').value,descripcion:$('acDescription').value,responsable:$('acResponsible').value,correo:$('acEmail').value,fechaCompromiso:$('acDue').value,estado:$('acStatus').value});
}
$('dpaCancel').onclick=()=>$('dpaModal').classList.add('hide');$('dpaEnter').onclick=unlockDpa;$('dpaPassword').onkeydown=e=>{if(e.key==='Enter')unlockDpa()};load();
</script></body></html>
